package com.mod;

import net.fabricmc.api.ModInitializer;
import net.minecraft.core.registries.Registries;
import net.minecraft.resources.ResourceKey;
import net.minecraft.resources.ResourceLocation;
import net.minecraft.world.level.Level;
import org.slf4j.Logger;
import org.slf4j.LoggerFactory;

public class MultiverseMod implements ModInitializer {
    public static final String MOD_ID = "multiverse";
    public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);

    // Definición de las tres dimensiones del multiverso
    public static final ResourceKey<Level> CONFEDERATE_DIM_KEY = ResourceKey.create(
            Registries.DIMENSION,
            new ResourceLocation(MOD_ID, "confederate_dimension")
    );

    public static final ResourceKey<Level> SOVIET_DIM_KEY = ResourceKey.create(
            Registries.DIMENSION,
            new ResourceLocation(MOD_ID, "soviet_dimension")
    );

    public static final ResourceKey<Level> PUFFER_DIM_KEY = ResourceKey.create(
            Registries.DIMENSION,
            new ResourceLocation(MOD_ID, "puffer_dimension")
    );

    @Override
    public void onInitialize() {
        LOGGER.info("Iniciando Multiverso Mod y registrando dimensiones...");
        registerDimensions();
    }

    private void registerDimensions() {
        LOGGER.info("Dimensión Confederada registrada: " + CONFEDERATE_DIM_KEY.location());
        LOGGER.info("Dimensión Soviética registrada: " + SOVIET_DIM_KEY.location());
        LOGGER.info("Dimensión del Pez Globo registrada: " + PUFFER_DIM_KEY.location());
    }
}
