package com.mod;

import net.minecraft.core.registries.Registries;
import net.minecraft.resources.ResourceKey;
import net.minecraft.resources.ResourceLocation;
import net.minecraft.world.entity.EntityType;
import net.minecraft.world.entity.MobCategory;
import net.minecraft.world.entity.ai.attributes.AttributeSupplier;
import net.minecraft.world.entity.ai.attributes.Attributes;
import net.minecraft.world.entity.animal.WaterAnimal;
import net.minecraft.world.level.Level;
import net.minecraftforge.common.MinecraftForge;
import net.minecraftforge.event.entity.EntityAttributeCreationEvent;
import net.minecraftforge.eventbus.api.IEventBus;
import net.minecraftforge.fml.common.Mod;
import net.minecraftforge.fml.event.lifecycle.FMLCommonSetupEvent;
import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
import net.minecraftforge.registries.DeferredRegister;
import net.minecraftforge.registries.ForgeRegistries;
import net.minecraftforge.registries.RegistryObject;
import org.apache.logging.log4j.LogManager;
import org.apache.logging.log4j.Logger;

@Mod(MultiverseMod.MOD_ID)
public class MultiverseMod {
    public static final String MOD_ID = "multiverse";
    public static final Logger LOGGER = LogManager.getLogger(MOD_ID);

    // Dimensiones del Multiverso
    public static final ResourceKey<Level> CONFEDERATE_DIM_KEY = ResourceKey.create(
            Registries.DIMENSION,
            new ResourceLocation(MOD_ID, "confederate_dimension")
    );

    public static final ResourceKey<Level> SOVIET_DIM_KEY = ResourceKey.create(
            Registries.DIMENSION,
            new ResourceLocation(MOD_ID, "soviet_dimension")
    );

    public static final ResourceKey<Level> PUFFER_DIM_KEY = ResourceKey.create(
            Registries.DIMENSION,
            new ResourceLocation(MOD_ID, "puffer_dimension")
    );

    // Registro de Entidades (Aldeano Pez Globo con traje de negocios - NPC)
    public static final DeferredRegister<EntityType<?>> ENTITIES = DeferredRegister.create(ForgeRegistries.ENTITY_TYPES, MOD_ID);

    public static final RegistryObject<EntityType<WaterAnimal>> BUSINESS_PUFFER_NPC = ENTITIES.register("business_puffer",
            () -> EntityType.Builder.of(WaterAnimal::new, MobCategory.CREATURE)
                    .sized(0.6F, 1.8F) // Medidas exactas de la forma del jugador común
                    .build(new ResourceLocation(MOD_ID, "business_puffer").toString())
    );

    public MultiverseMod() {
        IEventBus modEventBus = FMLJavaModLoadingContext.get().getModEventBus();

        ENTITIES.register(modEventBus);
        modEventBus.addListener(this::commonSetup);
        modEventBus.addListener(this::addEntityAttributes);

        MinecraftForge.EVENT_BUS.register(this);
    }

    private void commonSetup(final FMLCommonSetupEvent event) {
        LOGGER.info("MultiverseMod inicializado correctamente con dimensiones y NPCs de negocios.");
    }

    private void addEntityAttributes(EntityAttributeCreationEvent event) {
        event.put(BUSINESS_PUFFER_NPC.get(), AttributeSupplier.create()
                .add(Attributes.MAX_HEALTH, 20.0D)
                .add(Attributes.MOVEMENT_SPEED, 0.25D)
                .build());
    }
}
